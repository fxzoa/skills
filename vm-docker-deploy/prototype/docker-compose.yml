# Prototype Docker Compose Service

services:
  web:
    image: nginx:alpine
    container_name: web-prototype
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
